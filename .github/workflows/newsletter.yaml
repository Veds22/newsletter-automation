name: Weekly AI & Tech Newsletter

on:
  schedule:
    # Every Monday at 07:00 UTC. Adjust to your timezone as needed.
    - cron: "0 7 * * 1"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write  # needed to commit the generated newsletter back to the repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true  # caches resolved deps between runs, based on uv.lock

      - name: Install dependencies (from uv.lock, exact versions)
        run: uv sync --frozen  # "frozen" = fail loudly if lockfile is out of date,
                                # rather than silently re-resolving in CI

      - name: Run the newsletter pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: uv run main.py

      - name: Commit and push new edition
        run: |
          git config user.name "newsletter-bot"
          git config user.email "actions@github.com"
          git add newsletters/ docs/
          git diff --quiet --cached || git commit -m "Weekly newsletter: $(date +'%Y-%m-%d')"
          git push